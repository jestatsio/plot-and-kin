name: Build researcher installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested assets (only from a matching vVERSION tag)
        type: boolean
        default: false
      draft:
        description: Keep uploaded release assets in a draft for desktop acceptance
        type: boolean
        default: true
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'extension/**'
      - 'distribution/**'
      - '.github/workflows/release.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          PK_TEST_NATIVE_CREDENTIALS: '1'
      - run: npm run build
      - run: npm run test:cli
      - run: npm run release:package
      - run: npm run test:distribution
        env:
          PK_TEST_PACKAGED_DISTRIBUTION: '1'
      - run: npm run test:installer
      - run: npm run test:codex-client
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
  catalog:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Assemble offline Codex marketplace
        run: node scripts/assemble-codex-marketplace.mjs artifacts/release artifacts/codex-marketplace
      - name: Preserve launcher permissions in the marketplace artifact
        run: tar -czf artifacts/codex-marketplace.tar.gz -C artifacts/codex-marketplace .
      - uses: actions/upload-artifact@v4
        with:
          name: codex-marketplace
          path: artifacts/codex-marketplace.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [package, catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify tag, checksums, and all native builds
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PK_RELEASE_REF: ${{ github.ref }}
          PK_RELEASE_DRAFT: ${{ inputs.draft && '1' || '0' }}
